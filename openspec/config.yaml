schema: spec-driven

context: |
  Tech stack: Laravel 12, PHP 8.5 (Sail), PostgreSQL 16, Redis, Mailpit, React 18, TypeScript, Inertia.js, Tailwind CSS, Pest PHP
  Architecture: Inertia.js Monolith (Laravel backend + React TypeScript frontend)
  Testing: Pest PHP 5.x (Feature/Unit with RefreshDatabase)
  Quality: Laravel Pint, TypeScript (tsc --noEmit)

strict_tdd: true

testing:
  runner:
    command: ./vendor/bin/sail artisan test
    framework: pest
  layers:
    unit:
      available: true
      tool: pest
    integration:
      available: true
      tool: pest
    e2e:
      available: false
      tool: null
  coverage:
    available: true
    command: ./vendor/bin/sail artisan test --coverage
  quality:
    linter:
      available: true
      command: ./vendor/bin/sail bin pint
    type_checker:
      available: true
      command: npm run build
    formatter:
      available: true
      command: ./vendor/bin/sail bin pint

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
